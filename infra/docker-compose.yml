# Local development infrastructure: Postgres, Redis, Mailhog (test SMTP).
# Usage: docker compose -f infra/docker-compose.yml up -d
#
# Ports are deliberately off the defaults. A developer machine very often already
# runs a system PostgreSQL on 5432 or another project's Redis on 6379, and the
# container then fails to bind with an error that reads like a Docker problem
# rather than a port clash. Every URL in .env.example matches what is below.
#
# `name` is explicit for the same class of reason: Compose otherwise derives the
# project name from the containing directory, which is `infra` in every project
# of this portfolio, so two stacks would share one name and evict each other's
# containers and volumes.
name: booking
services:
  postgres:
    image: postgres:16-alpine
    container_name: booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: booking-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: booking-mailhog
    restart: unless-stopped
    ports:
      - "1027:1025" # SMTP
      - "8027:8025" # web UI at http://localhost:8027

volumes:
  pgdata:
  redisdata:
